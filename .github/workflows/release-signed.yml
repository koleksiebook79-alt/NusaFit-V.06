name: NusaFit Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: nusafit-signed-release
  cancel-in-progress: true

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 3. Setup Gradle 8.13
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      # 4. Verify project
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          grep -q 'compileSdk = 36' app/build.gradle.kts

          echo "======================================"
          echo "NusaFit Android Project"
          echo "compileSdk = 36"
          echo "JDK = 17"
          echo "Gradle = 8.13"
          echo "======================================"

      # 5. Create temporary release keystore
      - name: Create release keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/nusafit-release.keystore" \
            -alias nusafit \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "NusaFitTempStore123!" \
            -keypass "NusaFitTempStore123!" \
            -dname "CN=NusaFit, OU=Mobile, O=NusaFit, L=Indonesia, ST=West Java, C=ID"

          echo "Keystore successfully created."

      # 6. Build Release APK
      - name: Build signed Release APK
        shell: bash
        env:
          NUSAFIT_KEYSTORE: ${{ runner.temp }}/nusafit-release.keystore
          NUSAFIT_STORE_PASSWORD: NusaFitTempStore123!
          NUSAFIT_KEY_ALIAS: nusafit
          NUSAFIT_KEY_PASSWORD: NusaFitTempStore123!
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -PNUSAFIT_KEYSTORE="$NUSAFIT_KEYSTORE" \
            -PNUSAFIT_STORE_PASSWORD="$NUSAFIT_STORE_PASSWORD" \
            -PNUSAFIT_KEY_ALIAS="$NUSAFIT_KEY_ALIAS" \
            -PNUSAFIT_KEY_PASSWORD="$NUSAFIT_KEY_PASSWORD" \
            assembleRelease

      # 7. Check APK
      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK tidak ditemukan."
            exit 1
          fi

          echo "Release APK berhasil dibuat:"
          echo "$APK"

          ls -lh "$APK"

      # 8. Verify APK signature
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)

          APKSIGNER=$(find "$ANDROID_HOME" \
            -type f \
            -name "apksigner" \
            -print -quit)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner tidak ditemukan."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK signature berhasil diverifikasi."

      # 9. Prepare final APK
      - name: Prepare installable APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)

          mkdir -p release

          cp "$APK" \
            "release/NusaFit-v1.0.0-release-signed.apk"

          echo "======================================"
          echo "FINAL APK"
          echo "======================================"

          ls -lh release/NusaFit-v1.0.0-release-signed.apk

      # 10. Upload APK
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NusaFit-Signed-Release-APK
          path: release/NusaFit-v1.0.0-release-signed.apk
          if-no-files-found: error
          retention-days: 30
